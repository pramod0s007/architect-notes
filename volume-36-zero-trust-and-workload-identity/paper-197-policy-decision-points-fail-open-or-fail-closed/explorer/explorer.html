<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Policy Decision Points: Fail Open or Fail Closed &#183; Interactive Explorer &#183; Architect Notes</title>
<style>
:root{color-scheme:dark;--bg1:#061316;--bg2:#0E2E32;--page:#030B0D;--panel:#182527;--panel2:#273436;--inset:#020809;--line:#4D5A5A;--lane:#647171;--ink:#F2FFF9;--ink2:#CDDAD5;--muted:#CFDCD7;--bandInk:#F2FFF9;--bandSoft:#EAF7F2;--accH:#B6FF3B;--acc2H:#2DE1C2;--accT:#B6FF3B;--acc2T:#2DE1C2;--accBtn:#B6FF3B;--onAcc:#000000;--focus:#2DE1C2;--chipLine:#697675;--hl:#31482A;--rawhl:#2A3E14;--sec:#1A3837;--secT:#2DE1C2;--arrow:#9BA8A5;--badge:#E1EEE8;--badgeOn:#000000;--guard:#35D07F;--guardOn:#0B1020;--guardT:#35D07F;--guardBg:#1C3B32;--harm:#FF6B6B;--harmOn:#0B1020;--harmT:#FC908E;--harmBg:#362E30;--neutral:#8FA6D6;--neutralOn:#0B1020;--neutralT:#99AFDA;--neutralBg:#27363E;--amber:#F2B84B;--amberOn:#0B1020;--amberT:#F2B84B;--amberBg:#34382C;--glow:rgba(182,255,59,.22)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 -apple-system,"Avenir Next","Helvetica Neue",Arial,sans-serif;overflow-wrap:break-word}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
code,.mono{font-family:Menlo,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:10px;top:-80px;z-index:60;padding:10px 16px;border-radius:10px;background:var(--accBtn);color:var(--onAcc);font-weight:700;text-decoration:none}
.skip:focus{top:10px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding:0 20px}
#svgns{position:absolute;width:0;height:0;overflow:hidden}

/* header band */
.band{background:radial-gradient(760px 280px at 100% 0,var(--glow),transparent 72%),linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--bandInk);border-bottom:4px solid var(--accH);border-image:linear-gradient(90deg,var(--accH),var(--acc2H)) 1}
.band-in{display:grid;grid-template-columns:minmax(0,1fr);gap:14px 28px;align-items:center;padding-top:16px;padding-bottom:16px}
.eyebrow{margin:0 0 6px;font:700 12px/1.4 Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--acc2H)}
.band h1{margin:0 0 6px;font-size:clamp(24px,2.7vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
.tagline{margin:0 0 10px;font-size:16px;font-weight:600;color:var(--accH)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;padding:0;list-style:none}
.chips li{border:1px solid var(--chipLine);border-radius:999px;padding:2px 12px;font-size:11.5px;font-weight:700;line-height:1.5;letter-spacing:.08em}
.claim{margin:0;max-width:74ch;font-size:15px;color:var(--bandSoft)}
.cover{display:none;width:100%;height:auto;border-radius:12px;border:1px solid var(--chipLine);box-shadow:0 10px 28px rgba(0,0,0,.38)}
@media(min-width:720px){.band-in{grid-template-columns:minmax(0,1fr) clamp(220px,26vw,300px)}.cover{display:block}}
@media(max-width:559px){.wrap{padding:0 14px}.tagline{font-size:15px}.claim{font-size:14.5px}}

/* tabs and captions */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.tab{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:14px;font-weight:700;cursor:pointer}
.tab:hover{background:var(--panel2)}
.tab .k{font:700 11px/1.4 Menlo,Consolas,monospace;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.tab[aria-selected=true],.tab[aria-selected=true]:hover{background:var(--accBtn);border-color:var(--accBtn);color:var(--onAcc)}
.tab[aria-selected=true] .k{border-color:currentColor;color:var(--onAcc)}
@media(max-width:559px){.tab{flex:1 1 calc(50% - 8px);justify-content:center;padding:8px 10px;font-size:13.5px}}
.caption{margin:0 0 10px;max-width:120ch;font-size:15px}
.kick{display:block;margin-bottom:2px;font:700 11px/1.4 Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2T)}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.cbtns{display:flex;gap:8px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--lane)}
.btn.primary{min-width:110px;background:var(--accBtn);border-color:var(--accBtn);color:var(--onAcc)}
.btn[aria-disabled=true]{opacity:.5;cursor:default}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;min-height:40px;min-width:46px;padding:0 10px;border:0;border-right:1px solid var(--line);background:transparent;font:700 13px/1 Menlo,Consolas,monospace;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel2)}
.seg button[aria-pressed=true]{background:var(--accBtn);color:var(--onAcc)}
.seg button:focus-visible{outline-offset:-3px}
.scrub{flex:1 1 220px;display:flex;align-items:center;gap:12px;min-width:200px}
.count{min-width:8.4em;text-align:right;font:700 13px/1 Menlo,Consolas,monospace;color:var(--muted)}
input[type=range]{flex:1;min-width:0;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accBtn) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--accBtn)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-6px;border-radius:50%;background:var(--ink);border:3px solid var(--accBtn)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--accBtn)}
.hint{margin:6px 2px 0;font-size:12.5px;color:var(--muted)}
.hint b{font:700 11.5px/1 Menlo,Consolas,monospace;color:var(--ink2)}
@media(max-width:640px){.controls{padding:10px}.cbtns{width:100%}.cbtns .btn{flex:1;min-width:0;padding:0 6px}.cbtns .btn.primary{flex:2}.scrub{flex-basis:100%}.count{min-width:0;margin-left:auto}}
@media(max-width:480px){.cbtns .btn:not(.primary) span{display:none}.cbtns .btn:not(.primary){flex:0 0 52px}}
@media(max-width:559px){.hint{display:none}}
@media(min-width:900px) and (min-height:620px){html{scroll-padding-top:92px}.controls{position:sticky;top:8px;z-index:30;box-shadow:0 12px 24px -14px rgba(0,0,0,.6)}}

/* now strip */
.now{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:48px;margin:0;padding:8px 14px;border:1px solid var(--line);border-left:6px solid var(--tc,var(--line));border-radius:12px;background:var(--panel)}
.now .tag{font:700 11px/1.4 Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.now .who{font:700 13px/1.4 Menlo,Consolas,monospace}
.now .what{font-size:14.5px;overflow-wrap:anywhere}
.now .why{font-size:13px;color:var(--muted)}
.vc{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 7px;border-radius:999px;background:var(--fill);color:var(--on);font:700 11.5px/1.5 Menlo,Consolas,monospace;letter-spacing:.04em}
.vc .ic{stroke:none;fill:currentColor}
.vc .ic .cut{fill:none;stroke:var(--fill);stroke-width:2.4}
.vc .ic .cutf{fill:var(--fill);stroke:none}

/* tones */
.t-guard{--fill:var(--guard);--on:var(--guardOn);--tc:var(--guardT);--tint:var(--guardBg)}
.t-harm{--fill:var(--harm);--on:var(--harmOn);--tc:var(--harmT);--tint:var(--harmBg)}
.t-neutral{--fill:var(--neutral);--on:var(--neutralOn);--tc:var(--neutralT);--tint:var(--neutralBg)}
.t-unknown{--fill:var(--amber);--on:var(--amberOn);--tc:var(--amberT);--tint:var(--amberBg)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
.col{display:grid;gap:16px;min-width:0}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1fr) 400px}}
@media(min-width:1200px){.grid{grid-template-columns:minmax(0,1fr) 420px}}
.card{min-width:0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.card>h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;font:700 12px/1.4 -apple-system,"Avenir Next","Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card>h2 .n{font:700 12px/1.4 Menlo,Consolas,monospace;letter-spacing:.02em;text-transform:none;color:var(--ink2)}
.empty{margin:0;font-size:13.5px;color:var(--muted)}
.empty.pad{padding:16px}
.swipe{margin:-4px 0 10px;font-size:12.5px;color:var(--muted)}
.scroller:focus-visible{outline-offset:-3px}

/* lane timeline */
.tlscroll{position:relative;isolation:isolate;max-height:clamp(280px,calc(100vh - 230px),760px);min-height:180px;overflow:auto;scrollbar-gutter:stable;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tlscroll svg{display:block;max-width:none}
.tlhead{position:sticky;top:0;z-index:3}
.hbg{fill:var(--panel2)}
.hline{stroke:var(--line);stroke-width:1}
.lane{stroke:var(--lane);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
.labbg{fill:var(--panel);stroke:var(--lane);stroke-width:1}
.tlscroll text{font-family:-apple-system,"Avenir Next","Helvetica Neue",Arial,sans-serif}
.lab{font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle}
.secbg{fill:var(--sec)}
.sectext{font-size:11px;font-weight:700;letter-spacing:.12em;fill:var(--secT)}
.row.sec.cur .secbg{fill:var(--hl);stroke:var(--accT);stroke-width:1.5}
.row{opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
.row.shown{opacity:1;visibility:visible;transition:opacity .28s ease,visibility 0s}
.still .row,.still .row.shown{transition:none}
.hl{fill:var(--hl);opacity:0}
.row.cur .hl{opacity:1}
.arr{fill:none;stroke:var(--arrow);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.head{fill:var(--arrow)}
.row.ev[class*=t-] .arr{stroke:var(--fill)}
.row.ev[class*=t-] .head{fill:var(--fill)}
.row.cur .arr{stroke-width:2.8}
.msg{font-size:12.5px;font-weight:500;fill:var(--ink)}
.why{font-size:11px;font-weight:500;fill:var(--muted)}
.msg,.why{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.row.cur .msg,.row.cur .why{stroke:var(--hl)}
.row.cur .msg{font-weight:700}
.row.past .msg{fill:var(--ink2)}
.row.past .arr,.row.past .head,.row.past .bdg{opacity:.72}
.bdg{fill:var(--badge)}
.bdgt{font-size:10px;font-weight:700;fill:var(--badgeOn);text-anchor:middle}
.cbg{fill:var(--fill)}
.ct{font-size:10.5px;font-weight:700;letter-spacing:.04em;fill:var(--on)}
.gl{fill:var(--on)}
.gl .cut{fill:none;stroke:var(--fill);stroke-width:2.4;stroke-linecap:round}
.gl .cutf{fill:var(--fill);stroke:none}

/* raw output */
.rawbox{position:relative;height:clamp(220px,34vh,340px);overflow:auto;padding:8px 0;background:var(--inset);border:1px solid var(--line);border-radius:10px;font:12.5px/1.55 Menlo,Consolas,monospace}
.rawbox .empty{display:none;padding:6px 12px;font-family:-apple-system,"Avenir Next","Helvetica Neue",Arial,sans-serif}
.rawbox.is-empty .empty{display:block}
.ln{display:none;grid-template-columns:3.4em minmax(0,1fr);padding-right:10px}
.ln.shown{display:grid}
.lno{padding-right:10px;text-align:right;color:var(--muted);user-select:none}
.ltx{white-space:pre-wrap;overflow-wrap:anywhere}
.ln.cur{background:var(--rawhl);box-shadow:inset 3px 0 0 var(--accT)}
.k-section .ltx{font-weight:700;color:var(--secT)}
.seg-no{color:var(--muted)}
.seg-v{font-weight:700;color:var(--tc)}
.seg-r{font-weight:700}
.r-pass{color:var(--guardT)}
.r-fail{color:var(--harmT)}
.seg-val{font-weight:700;color:var(--accT)}

/* metrics and checks */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{min-height:72px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.mcard.pending{border-style:dashed;background:transparent}
.mcard.pending>*,.chk.pending>*{visibility:hidden}
.mcard.fresh,.chk.fresh{box-shadow:0 0 0 2px var(--accT)}
.mn{font:600 11.5px/1.4 Menlo,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}
.mv{font-size:26px;font-weight:800;line-height:1.2;color:var(--accT);overflow-wrap:anywhere}
.mv.long{font-size:16px;line-height:1.35}
.checks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.chk{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;min-height:46px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.chk.pending{border-style:dashed;background:transparent}
.ico{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--on)}
.cn{font:700 13px/1.4 Menlo,Consolas,monospace;overflow-wrap:anywhere}
.cd{margin-top:2px;font-size:12.5px;color:var(--muted)}
.cr{font:700 11.5px/1.6 Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--tc)}

/* compare */
.cmpcards{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:16px}
@media(min-width:900px){.cmpcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cmp{display:flex;flex-direction:column}
.cmp>.btn{margin-top:auto;align-self:flex-start}
.cmp>.empty{margin-bottom:12px}
.cmp h3{margin:0 0 6px;font-size:17px;line-height:1.3}
.cmp h3 .k{margin-right:8px;font:700 11px/1.4 Menlo,Consolas,monospace;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);vertical-align:2px}
.sum{margin:0 0 12px;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.stat{padding:7px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{display:block;font-size:11px;line-height:1.3;color:var(--muted)}
.bar{display:flex;height:12px;margin:0 0 8px;overflow:hidden;border-radius:99px;background:var(--line)}
.bar i{display:block;min-width:0;background:var(--fill)}
.bar i.t-none{background:var(--lane)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;background:var(--fill);vertical-align:-1px}
.legend i.t-none{background:var(--lane)}
.tscroll{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;min-width:600px;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl thead th{background:var(--panel2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.tbl tbody th{font:700 13px/1.4 Menlo,Consolas,monospace;background:var(--panel)}
.tbl thead th:first-child,.tbl tbody th{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.tbl thead th:first-child{z-index:2}
.tbl td.num{font:700 14px/1.4 Menlo,Consolas,monospace;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 6px;border-radius:999px;background:var(--fill);color:var(--on);font:700 11.5px/1.5 Menlo,Consolas,monospace;letter-spacing:.04em}
.badge .ic{stroke-width:2.6}
.dd{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.na{color:var(--muted)}
.panel>.card+.card{margin-top:16px}

/* footer */
.foot{margin:30px 0 36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot p{margin:0 0 6px}
.foot .main{font-size:14px;color:var(--ink2)}
.foot code{padding:1px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.nojs{max-width:900px;margin:0 auto;padding:20px}
.nojs pre{padding:12px;overflow:auto;background:var(--inset);border:1px solid var(--line);border-radius:10px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(forced-colors:active){.btn,.tab,.seg,.seg button,.card,.chk,.mcard,.now{border:1px solid CanvasText}.tab[aria-selected=true],.seg button[aria-pressed=true]{outline:2px solid Highlight}}
</style>
<script>
(function(){var d=document.documentElement,n=0;function bump(){n+=1;d.setAttribute('data-an-errors',String(n))}d.setAttribute('data-an-errors','0');window.addEventListener('error',bump);window.addEventListener('unhandledrejection',bump)})();
</script>
</head>

    var failing = sc.lines.filter(function (l) { return l.k === 'check' && l.result === 'FAIL'; });
    cards.appendChild(h('article', {'class': 'card cmp'}, [
      h('h3', null, [h('span', {'class': 'k'}, String(i + 1)), sc.tab]),
      h('p', {'class': 'sum'}, sc.summary),
      h('div', {'class': 'stats'}, [
        h('div', {'class': 'stat'}, [h('b', null, String(c.events)), h('span', null, 'events')]),
        h('div', {'class': 'stat'}, [h('b', null, String(c.guard)), h('span', null, 'guard')]),
        h('div', {'class': 'stat'}, [h('b', null, String(c.harm)), h('span', null, 'harm')]),
        h('div', {'class': 'stat'}, [h('b', null, c.failed + '/' + c.checks), h('span', null, 'checks failed')])
      ]),
      c.events ? bar : h('p', {'class': 'empty'}, 'No events in this output.'),
      c.events ? h('ul', {'class': 'legend'}, segs.filter(function (s) { return s[1] > 0; }).map(function (s) { return h('li', null, [h('i', {'class': s[0]}), s[1] + ' ' + s[2]]); })) : null,
      failing.length ? h('p', {'class': 'empty'}, 'Failed: ' + failing.map(function (l) { return l.name; }).join(', ')) : null,
      go
    ]));
  });
  panel.appendChild(cards);

  var names = scs.map(function (s) { return s.tab; });
  var head = function (first) { return h('thead', null, h('tr', null, [h('th', {scope: 'col'}, first)].concat(names.map(function (t) { return h('th', {scope: 'col'}, t); })))); };
  var matrix = h('table', {'class': 'tbl'}, [h('caption', {'class': 'sr'}, 'Check results by scenario'), head('Check'), h('tbody', null, C.checks.map(function (row) {
    return h('tr', null, [h('th', {scope: 'row'}, splitName(row.name))].concat(row.cells.map(function (cell) {
      return cell ? h('td', null, [badge(cell.r), cell.d ? h('span', {'class': 'dd'}, cell.d) : null])
                  : h('td', {'class': 'na'}, [h('span', {'aria-hidden': 'true'}, '\u2014'), h('span', {'class': 'sr'}, 'not run')]);
    })));
  }))]);
  panel.appendChild(h('section', {'class': 'card', 'aria-label': 'Check matrix'}, [
    h('h2', null, ['Check matrix', h('span', {'class': 'n'}, plural(C.checks.length, 'check', 'checks'))]),
    C.checks.length ? h('div', {'class': 'tscroll scroller', tabindex: '0', role: 'region', 'aria-label': 'Check matrix, scrollable'}, matrix) : h('p', {'class': 'empty'}, 'No CHECK lines in any scenario.')
  ]));

  var metrics = h('table', {'class': 'tbl'}, [h('caption', {'class': 'sr'}, 'Metric values by scenario'), head('Metric'), h('tbody', null, C.metrics.map(function (row) {
    return h('tr', null, [h('th', {scope: 'row'}, splitName(row.name))].concat(row.cells.map(function (cell) {
      return cell === null ? h('td', {'class': 'na'}, [h('span', {'aria-hidden': 'true'}, '\u2014'), h('span', {'class': 'sr'}, 'not reported')]) : h('td', {'class': 'num'}, cell);
    })));
  }))]);
  panel.appendChild(h('section', {'class': 'card', 'aria-label': 'Metrics'}, [
    h('h2', null, ['Metrics', h('span', {'class': 'n'}, plural(C.metrics.length, 'metric', 'metrics'))]),
    C.metrics.length ? h('div', {'class': 'tscroll scroller', tabindex: '0', role: 'region', 'aria-label': 'Metrics table, scrollable'}, metrics) : h('p', {'class': 'empty'}, 'No METRIC lines in any scenario.')
  ]));
}

/* ---------- tabs ---------- */
function ensureBuilt(id) {
  var panel = $('panel-' + id), v;
  if (panel.getAttribute('data-built')) return views[id] || null;
  panel.setAttribute('data-built', '1');
  if (id === 'compare') { buildCompare(panel); return null; }
  v = buildScenario(D.scenarios.filter(function (s) { return s.id === id; })[0], panel);
  views[id] = v;
  buildTimeline(v);
  if (typeof ResizeObserver === 'function') {
    v.ro = new ResizeObserver(function () {
      if (S.tab === v.id && v.scroller.clientWidth > 0 && Math.abs(v.scroller.clientWidth - v.builtW) >= 2) { buildTimeline(v); render(v); }
    });
    v.ro.observe(v.scroller);
  }
  return v;
}
function showTab(id, o) {
  var v;
  if (IDS.indexOf(id) < 0) id = 'pressure';
  stop();
  S.tab = id;
  TABS.forEach(function (t) {
    var on = t.id === id;
    $('tab-' + t.id).setAttribute('aria-selected', on ? 'true' : 'false');
    $('panel-' + t.id).hidden = !on;
  });
  v = ensureBuilt(id);
  if (v) {
    if (v.scroller.clientWidth > 0 && Math.abs(v.scroller.clientWidth - v.builtW) >= 2) buildTimeline(v);
    if (typeof o.step === 'number') v.step = clamp(o.step, 0, v.total);
    render(v);
    if (!o.silent) say(KICKER[id] + '. ' + describe(v));
    if (!o.noHash) writeHash(v);
  } else {
    document.documentElement.setAttribute('data-an-state', 'compare');
    if (!o.silent) say('Compare tab. ' + D.scenarios.map(function (s) { return s.tab + ': ' + s.summary; }).join(' '));
    if (!o.noHash) writeHash(null);
  }
}

/* ---------- URL hash: #s=pressure|wrong-direction|principle-applied|compare&step=N|end ---------- */
function applyHash(initial) {
  var p = new URLSearchParams(location.hash.replace(/^#/, '')), s = p.get('s'), st = p.get('step'), v, n;
  if (!s && !initial) return;
  if (IDS.indexOf(s) < 0) s = 'pressure';
  showTab(s, {silent: true, noHash: true});
  v = views[s];
  if (v) {
    n = st === 'end' ? v.total : clamp(parseInt(st, 10) || 0, 0, v.total);
    setStep(v, n, {silent: true, noHash: true});
  }
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function (e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target, tag = t && t.tagName, k = e.key, v = curView(), i;
  if (tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && t.type !== 'range') || (t && t.isContentEditable)) return;
  if (k === ' ' || k === 'Spacebar') {
    if (tag === 'BUTTON' || tag === 'A') return;
    if (v) { e.preventDefault(); act(v, 'play'); }
  } else if (k === 'ArrowRight' || k === 'ArrowLeft') {
    if (tag === 'INPUT' || e.shiftKey) return;
    if (v) { e.preventDefault(); act(v, k === 'ArrowRight' ? 'fwd' : 'back'); }
  } else if (k === 'r' || k === 'R') {
    if (v) { e.preventDefault(); act(v, 'reset'); }
  } else if (k >= '1' && k <= String(TABS.length)) {
    e.preventDefault();
    showTab(TABS[parseInt(k, 10) - 1].id, {});
  } else if (k === '[' || k === ']') {
    i = SPEEDS.indexOf(S.speed) + (k === ']' ? 1 : -1);
    e.preventDefault();
    setSpeed(SPEEDS[clamp(i, 0, SPEEDS.length - 1)]);
  }
});
window.addEventListener('hashchange', function () { applyHash(false); });

renderHeader();
renderTabs();
renderFooter();
applyHash(true);
document.documentElement.setAttribute('data-an-ready', '1');
})();
</script>
